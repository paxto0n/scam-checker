<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scam Checker - Guidance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>What to do next</h1>

        <div class="card">
            <p>{{ result.summary }}</p>
            <ol>
                {% for step in result.steps %}
                    <li>{{ step }}</li>
                {% endfor %}
            </ol>
        </div>

        <a href="/">Check another link</a>
    </div>
</body>
</html>
